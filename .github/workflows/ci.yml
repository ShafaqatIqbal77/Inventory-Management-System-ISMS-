
name: IPMS CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  docker-build:
    name: Build and Publish Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build frontend image
        run: |
          docker build \
            -t shafaqatiqbal/ipms-frontend:latest \
            -t shafaqatiqbal/ipms-frontend:${GITHUB_SHA} \
            ./client

      - name: Build backend image
        run: |
          docker build \
            -t shafaqatiqbal/ipms-backend:latest \
            -t shafaqatiqbal/ipms-backend:${GITHUB_SHA} \
            ./server

      - name: Push frontend image
        if: github.event_name == 'push'
        run: |
          docker push shafaqatiqbal/ipms-frontend:latest
          docker push shafaqatiqbal/ipms-frontend:${GITHUB_SHA}

      - name: Push backend image
        if: github.event_name == 'push'
        run: |
          docker push shafaqatiqbal/ipms-backend:latest
          docker push shafaqatiqbal/ipms-backend:${GITHUB_SHA}
